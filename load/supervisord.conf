[supervisord]
user=root
nodaemon=true
childlogdir=/ws/logs
logfile=/ws/logs/supervisord.log

[program:sshd]
command=ssh_server
stdout_logfile=/ws/logs/sshd.log
redirect_stderr=true

[program:openconnect]
startretries=0
startsecs=9999999 # 115 days
command=/ws/config/openconnect.sh
stdout_logfile=/ws/logs/openconnect.log
redirect_stderr=true
autorestart=false

[eventlistener:quit_on_failure]
command=sh -c "printf 'READY\n' && while read line; do kill -SIGTERM $PPID; done"
events=PROCESS_STATE_FATAL, PROCESS_STATE_EXITED
